<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#151515"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb800"/>
      <stop offset="100%" style="stop-color:#cc9400"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bgGrad2)"/>

  <!-- Abstract circles -->
  <g opacity="0.08">
    <circle cx="150" cy="300" r="250" fill="none" stroke="#ffb800" stroke-width="2"/>
    <circle cx="1770" cy="300" r="300" fill="none" stroke="#ffb800" stroke-width="2"/>
    <circle cx="960" cy="300" r="400" fill="none" stroke="#ffb800" stroke-width="1"/>
  </g>

  <!-- Briefcase icon - abstract -->
  <g transform="translate(960, 300)" opacity="0.15">
    <rect x="-120" y="-80" width="240" height="180" rx="20" fill="none" stroke="#ffb800" stroke-width="4"/>
    <path d="M-60 -80 L-60 -110 Q-60 -130 -40 -130 L40 -130 Q60 -130 60 -110 L60 -80" fill="none" stroke="#ffb800" stroke-width="4"/>
    <line x1="-120" y1="-20" x2="120" y2="-20" stroke="#ffb800" stroke-width="4"/>
    <circle cx="0" cy="-20" r="15" fill="#ffb800"/>
  </g>

  <!-- Decorative elements -->
  <g opacity="0.1">
    <line x1="50" y1="300" x2="350" y2="300" stroke="#ffb800" stroke-width="2"/>
    <line x1="1570" y1="300" x2="1870" y2="300" stroke="#ffb800" stroke-width="2"/>
  </g>

  <!-- Dots pattern -->
  <g opacity="0.05">
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#ffb800"/>
    </pattern>
    <rect width="1920" height="600" fill="url(#dots)"/>
  </g>

  <!-- Rising bars representing growth -->
  <g transform="translate(1600, 450)" opacity="0.1">
    <rect x="0" y="0" width="30" height="80" fill="#ffb800"/>
    <rect x="40" y="-30" width="30" height="110" fill="#ffb800"/>
    <rect x="80" y="-70" width="30" height="150" fill="#ffb800"/>
  </g>

  <g transform="translate(200, 450)" opacity="0.1">
    <rect x="0" y="-70" width="30" height="150" fill="#ffb800"/>
    <rect x="40" y="-30" width="30" height="110" fill="#ffb800"/>
    <rect x="80" y="0" width="30" height="80" fill="#ffb800"/>
  </g>
</svg>
