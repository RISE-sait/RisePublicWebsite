<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb800"/>
      <stop offset="100%" style="stop-color:#e0a300"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Abstract geometric pattern -->
  <g opacity="0.1">
    <circle cx="200" cy="200" r="300" fill="none" stroke="#ffb800" stroke-width="2"/>
    <circle cx="1720" cy="880" r="400" fill="none" stroke="#ffb800" stroke-width="2"/>
    <circle cx="960" cy="540" r="500" fill="none" stroke="#ffb800" stroke-width="1"/>
  </g>

  <!-- Abstract figures representing team/people -->
  <g transform="translate(960, 540)">
    <!-- Center figure -->
    <g transform="translate(0, -50)">
      <circle cx="0" cy="-80" r="45" fill="url(#goldGrad)"/>
      <path d="M-60 20 Q-60 -30 0 -30 Q60 -30 60 20 L60 100 Q60 120 40 120 L-40 120 Q-60 120 -60 100 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- Left figure -->
    <g transform="translate(-180, 30)" opacity="0.7">
      <circle cx="0" cy="-80" r="40" fill="#ffb800"/>
      <path d="M-50 20 Q-50 -25 0 -25 Q50 -25 50 20 L50 90 Q50 110 35 110 L-35 110 Q-50 110 -50 90 Z" fill="#ffb800"/>
    </g>

    <!-- Right figure -->
    <g transform="translate(180, 30)" opacity="0.7">
      <circle cx="0" cy="-80" r="40" fill="#ffb800"/>
      <path d="M-50 20 Q-50 -25 0 -25 Q50 -25 50 20 L50 90 Q50 110 35 110 L-35 110 Q-50 110 -50 90 Z" fill="#ffb800"/>
    </g>

    <!-- Far left figure -->
    <g transform="translate(-340, 80)" opacity="0.4">
      <circle cx="0" cy="-70" r="35" fill="#ffb800"/>
      <path d="M-45 15 Q-45 -20 0 -20 Q45 -20 45 15 L45 75 Q45 95 30 95 L-30 95 Q-45 95 -45 75 Z" fill="#ffb800"/>
    </g>

    <!-- Far right figure -->
    <g transform="translate(340, 80)" opacity="0.4">
      <circle cx="0" cy="-70" r="35" fill="#ffb800"/>
      <path d="M-45 15 Q-45 -20 0 -20 Q45 -20 45 15 L45 75 Q45 95 30 95 L-30 95 Q-45 95 -45 75 Z" fill="#ffb800"/>
    </g>
  </g>

  <!-- Rising arrow/growth symbol -->
  <g transform="translate(960, 800)" opacity="0.6">
    <path d="M-100 50 L0 -50 L100 50" fill="none" stroke="#ffb800" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 -50 L0 80" fill="none" stroke="#ffb800" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Decorative lines -->
  <g opacity="0.2">
    <line x1="100" y1="540" x2="400" y2="540" stroke="#ffb800" stroke-width="2"/>
    <line x1="1520" y1="540" x2="1820" y2="540" stroke="#ffb800" stroke-width="2"/>
  </g>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#ffb800" stroke-width="1"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#grid)"/>
  </g>
</svg>
